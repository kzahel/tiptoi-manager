name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install bootstrap tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Validate reference manifest without cloning upstreams
        run: python scripts/references.py validate
      - name: Compile Python tooling
        run: python -m compileall -q scripts
      - name: Check Android translations
        run: |
          python scripts/i18n.py check
          python -m unittest discover -s scripts -p 'test_localization*.py'
      - name: Check Play listing exports
        run: python scripts/check_store.py
      - name: Check whitespace
        run: git show --format= --check HEAD
