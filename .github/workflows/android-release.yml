name: Android release candidate
on:
  push:
    tags: ['play-v*']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused, increasing Google Play version code'
        required: true
permissions:
  contents: read

defaults:
  run:
    shell: bash
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tag, version and main ancestry
        id: plan
        env:
          MANUAL_CODE: ${{ inputs.version_code }}
        run: |
          args=(--ref "$GITHUB_REF" --source "$GITHUB_SHA")
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--version-code "$MANUAL_CODE")
          fi
          python3 scripts/play_publish.py plan "${args[@]}" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Check translations and store assets
        run: |
          python3 scripts/i18n.py check
          python3 -m unittest discover -s scripts
          python3 scripts/check_store.py
      - name: Prepare dedicated upload key and catalog registration
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          CATALOG_CLIENT_ID: ${{ secrets.CATALOG_CLIENT_ID }}
          CATALOG_CLIENT_SECRET: ${{ secrets.CATALOG_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'pen-library-release'
          folder.mkdir(mode=0o700)
          for name, data in [('upload.jks', base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True)), ('password.secret', os.environ['STORE_PASSWORD'].encode())]:
              assert data, 'Release signing configuration is missing'
              path = folder / name
              path.write_bytes(data)
              path.chmod(0o600)
          client_id, client_secret = os.environ['CATALOG_CLIENT_ID'], os.environ['CATALOG_CLIENT_SECRET']
          assert client_id and client_secret and not any(c in client_id + client_secret for c in '\r\n'), 'Catalog configuration missing or invalid'
          config = folder / 'catalog.properties'
          config.write_text('client.id=' + client_id + '\nclient.secret=' + client_secret + '\n')
          config.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PEN_LIBRARY_RELEASE_SIGNING_DIR={folder}\nTIPTOI_CATALOG_CLIENT_FILE={config}\n')
          PY
      - name: Test, lint, build signed production APK and AAB
        env:
          TIPTOI_VERSION_CODE: ${{ needs.prepare.outputs.code }}
        run: |
          android/gradlew -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Exercise the read-only demo and capture German screens
        run: |
          sudo chmod a+rw /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name pen-library-ci --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" @pen-library-ci -port 5580 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb -s emulator-5580 emu kill || kill "$emulator_pid"; wait "$emulator_pid" || true' EXIT
          timeout 90 adb -s emulator-5580 wait-for-device
          # shellcheck disable=SC2016
          timeout 240 bash -c 'until [[ $(adb -s emulator-5580 shell getprop sys.boot_completed | tr -d "\r") == 1 ]]; do sleep 2; done'
          adb -s emulator-5580 shell input keyevent 82
          adb -s emulator-5580 shell wm size 1080x1920
          adb -s emulator-5580 shell wm density 420
          adb -s emulator-5580 install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5580 install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb -s emulator-5580 shell am instrument -w -r -e demoReadOnly true \
            io.github.kzahel.tiptoimanager.debug.test/io.github.kzahel.tiptoimanager.UsbSmokeInstrumentation | tee "$RUNNER_TEMP/demo-smoke.txt"
          grep -q 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/demo-smoke.txt"
          adb -s emulator-5580 install -r android/app/build/outputs/apk/release/app-release.apk
          python3 scripts/store_screenshots.py --serial emulator-5580 --locale de-DE --output "$RUNNER_TEMP/screens" \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            --bold-font /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Prepare candidate receipt and listing archive
        env:
          MANUAL_CODE: ${{ inputs.version_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir candidate
          cp android/app/build/outputs/bundle/release/app-release.aab candidate/pen-library.aab
          cp android/app/build/outputs/apk/release/app-release.apk candidate/pen-library.apk
          args=(--ref "$GITHUB_REF" --source "$GITHUB_SHA" --candidate candidate)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--version-code "$MANUAL_CODE")
          fi
          zip -q -r candidate/play-listing.zip store -x 'store/README.md'
          zip -q -j candidate/emulator-evidence.zip "$RUNNER_TEMP/demo-smoke.txt" "$RUNNER_TEMP"/screens/de-DE/phone/*.png
          python3 scripts/play_publish.py receipt "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pen-library-release
          path: candidate/*
          retention-days: 90
      - name: Clean signing material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/pen-library-release"
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pen-library-release
          path: candidate
      - name: Publish source-bound release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('candidate/source.json').read_text())
          Path('notes.md').write_text('Pen Library '+r['versionName']+' release candidate.\n\nEnglish, German and French interface. USB pen management, verified transfers and removal backups, local phone storage controls and multiple pen profiles.\n\nRequires compatible USB mass storage and a data cable/adapter. Catalog audio is currently German. Keep the app open during transfers.\n\nSource: '+r['commit']+'\nCI: '+r['run']+'\n\nIndependent utility, not affiliated with Ravensburger. GitHub availability does not imply Google Play approval.\n')
          PY
          VERSION=$(python3 -c 'import json;print(json.load(open("candidate/source.json"))["versionName"])')
          SOURCE=$(python3 -c 'import json;print(json.load(open("candidate/source.json"))["commit"])')
          CODE=$(python3 -c 'import json;print(json.load(open("candidate/source.json"))["versionCode"])')
          gh release create "$RELEASE" candidate/* --target "$SOURCE" --title "Pen Library ${VERSION} (candidate ${CODE})" --prerelease --notes-file notes.md
  internal:
    if: needs.prepare.outputs.operation == 'internal'
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: android-play
      cancel-in-progress: false
    environment: play-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the exact GitHub candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: gh release download "$RELEASE" --pattern source.json --pattern pen-library.aab --dir candidate
      - name: Verify the candidate receipt and checked-in listing
        run: python3 scripts/play_publish.py verify --ref "$GITHUB_REF" --source "$GITHUB_SHA" --candidate candidate
      - name: Authenticate to Play without a key file
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish the candidate to internal testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          python3 scripts/play_publish.py publish --ref "$GITHUB_REF" --source "$GITHUB_SHA" --candidate candidate | tee -a "$GITHUB_STEP_SUMMARY"
