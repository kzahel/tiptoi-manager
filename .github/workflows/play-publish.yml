name: Google Play publication
on:
  push:
    tags: ['play-promote-v*', 'play-listing-*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tag, version and main ancestry
        id: plan
        run: python3 scripts/play_publish.py plan --ref "$GITHUB_REF" --source "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: play-publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the exact internal candidate receipt
        if: needs.prepare.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: gh release download "$RELEASE" --pattern source.json --dir candidate
      - name: Verify the candidate receipt and checked-in listing
        run: python3 scripts/play_publish.py verify --ref "$GITHUB_REF" --source "$GITHUB_SHA" --candidate candidate
      - name: Authenticate to Play without a key file
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Check access or submit the tagged changes
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          python3 scripts/play_publish.py publish --ref "$GITHUB_REF" --source "$GITHUB_SHA" --candidate candidate | tee -a "$GITHUB_STEP_SUMMARY"
